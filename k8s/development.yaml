apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-lab-api
  namespace: development
  labels:
    app: harness-lab-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: harness-lab-api
  template:
    metadata:
      labels:
        app: harness-lab-api
    spec:
      containers:
        - name: api
          image: IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/dummies
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/dummies
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: harness-lab-api
  namespace: development
spec:
  type: ClusterIP
  selector:
    app: harness-lab-api
  ports:
    - name: http
      port: 80
      targetPort: 8080

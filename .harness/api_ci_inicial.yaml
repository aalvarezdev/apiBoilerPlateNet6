pipeline:
  name: API CI
  identifier: api_ci_inicial
  projectIdentifier: harness_lab
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: github_api_boilerplate
        build: <+input>
  variables:
    - name: deployment_namespace
      type: String
      value: development
  stages:
    - stage:
        name: Build and tests
        identifier: build_test
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Build and test
                  identifier: clone_test
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      git rev-parse HEAD
                      if ! dotnet --list-sdks | grep -q '^10\.'; then
                        curl -fsSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0
                        export PATH="$HOME/.dotnet:$PATH"
                      fi
                      dotnet --version
                      dotnet restore Backend.sln
                      dotnet build Backend.sln -c Release --no-restore
                      dotnet test Backend.sln -c Release --no-build --no-restore
              - step:
                  type: Run
                  name: Build image
                  identifier: build_image
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      docker build -f Backend.Api/Dockerfile --build-arg BUILD_COMMIT="<+codebase.commitSha>" --build-arg BUILD_NUMBER="<+pipeline.sequenceId>" --build-arg BUILD_EXECUTION_ID="<+pipeline.executionId>" --build-arg BUILD_PIPELINE_URL="<+pipeline.executionUrl>" -t harness-lab-api:<+codebase.commitSha> .
                      docker image inspect harness-lab-api:<+codebase.commitSha> --format '{{.Id}}'
              - step:
                  type: Run
                  name: Publish image to ACR
                  identifier: publish_image
                  spec:
                    shell: Bash
                    envVariables:
                      ACR_CLIENT_ID: <+secrets.getValue("acr_push_client_id")>
                      ACR_CLIENT_SECRET: <+secrets.getValue("acr_push_client_secret")>
                    command: |-
                      set -euo pipefail
                      sha="<+codebase.commitSha>"
                      test "$sha" = "$(git rev-parse HEAD)"
                      image="acrharnesslabalvarez26.azurecr.io/harness-lab-api:$sha"
                      printf '%s' "$ACR_CLIENT_SECRET" | docker login acrharnesslabalvarez26.azurecr.io --username "$ACR_CLIENT_ID" --password-stdin
                      if docker manifest inspect "$image" >/dev/null 2>&1; then
                        echo "Commit tag already exists; reusing the published image"
                      else
                        docker tag "harness-lab-api:$sha" "$image"
                        docker push "$image"
                      fi
                      docker logout acrharnesslabalvarez26.azurecr.io
              - step:
                  type: Run
                  name: Verify and lock image
                  identifier: lock_image
                  spec:
                    image: mcr.microsoft.com/azure-cli@sha256:a4e2660b4099b76f02001a9316a0eb0dc56e330b5f7d1d1312c932200645bf26
                    shell: Bash
                    envVariables:
                      ACR_CLIENT_ID: <+secrets.getValue("acr_push_client_id")>
                      ACR_CLIENT_SECRET: <+secrets.getValue("acr_push_client_secret")>
                    command: |-
                      set -euo pipefail
                      sha="<+codebase.commitSha>"
                      image="harness-lab-api:$sha"
                      az login --service-principal --username "$ACR_CLIENT_ID" --password "$ACR_CLIENT_SECRET" --tenant e0e40cd0-d97b-4524-823d-d71f5ee37563 --output none
                      write_enabled=$(az acr repository show --name acrharnesslabalvarez26 --image "$image" --query changeableAttributes.writeEnabled --output tsv)
                      if [ "$write_enabled" != "false" ]; then
                        az acr repository update --name acrharnesslabalvarez26 --image "$image" --write-enabled false --delete-enabled false --output none
                      fi
                      az acr repository show --name acrharnesslabalvarez26 --image "$image" --output json | python3 -c 'import json,re,sys; d=json.load(sys.stdin); digest=d["digest"]; flags=d["changeableAttributes"]; assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest); assert flags["writeEnabled"] is False and flags["deleteEnabled"] is False; print("Verified immutable image: acrharnesslabalvarez26.azurecr.io/harness-lab-api@"+digest)'
              - step:
                  type: Run
                  name: Deploy digest to development
                  identifier: deploy_development
                  spec:
                    image: mcr.microsoft.com/azure-cli@sha256:a4e2660b4099b76f02001a9316a0eb0dc56e330b5f7d1d1312c932200645bf26
                    shell: Bash
                    envVariables:
                      ACR_CLIENT_ID: <+secrets.getValue("acr_push_client_id")>
                      ACR_CLIENT_SECRET: <+secrets.getValue("acr_push_client_secret")>
                      KUBECONFIG_B64: <+secrets.getValue("aks_development_kubeconfig_b64")>
                    command: |-
                      set -euo pipefail
                      sha="<+codebase.commitSha>"
                      namespace="<+pipeline.variables.deployment_namespace>"
                      test "$namespace" = development
                      az login --service-principal --username "$ACR_CLIENT_ID" --password "$ACR_CLIENT_SECRET" --tenant e0e40cd0-d97b-4524-823d-d71f5ee37563 --output none
                      image_json=$(az acr repository show --name acrharnesslabalvarez26 --image "harness-lab-api:$sha" --output json)
                      digest=$(printf '%s' "$image_json" | python3 -c 'import json,re,sys; d=json.load(sys.stdin); f=d["changeableAttributes"]; x=d["digest"]; assert re.fullmatch(r"sha256:[0-9a-f]{64}",x); assert f["writeEnabled"] is False and f["deleteEnabled"] is False; print(x)')
                      image="acrharnesslabalvarez26.azurecr.io/harness-lab-api@$digest"
                      export KUBECONFIG="$(mktemp)"
                      trap 'rm -f "$KUBECONFIG" ./kubectl ./kubectl.sha256 ./development.rendered.yaml' EXIT
                      printf '%s' "$KUBECONFIG_B64" | base64 -d > "$KUBECONFIG"
                      chmod 600 "$KUBECONFIG"
                      curl -fsSLo ./kubectl https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
                      curl -fsSLo ./kubectl.sha256 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256
                      printf '%s  %s\n' "$(cat ./kubectl.sha256)" ./kubectl | sha256sum -c -
                      chmod +x ./kubectl
                      sed "s#IMAGE_DIGEST#$image#g" k8s/development.yaml > ./development.rendered.yaml
                      ./kubectl apply -f ./development.rendered.yaml
                      ./kubectl rollout status deployment/harness-lab-api -n "$namespace" --timeout=180s
                      actual=$(./kubectl get deployment harness-lab-api -n "$namespace" -o jsonpath='{.spec.template.spec.containers[0].image}')
                      test "$actual" = "$image"
                      ./kubectl get pods -n "$namespace" -l app=harness-lab-api
                      echo "Deployed $image to $namespace"
              - step:
                  type: Run
                  name: Deploy digest to public website
                  identifier: deploy_website
                  spec:
                    image: mcr.microsoft.com/azure-cli@sha256:a4e2660b4099b76f02001a9316a0eb0dc56e330b5f7d1d1312c932200645bf26
                    shell: Bash
                    envVariables:
                      ACR_CLIENT_ID: <+secrets.getValue("acr_push_client_id")>
                      ACR_CLIENT_SECRET: <+secrets.getValue("acr_push_client_secret")>
                    command: |-
                      set -euo pipefail
                      sha="<+codebase.commitSha>"
                      az login --service-principal --username "$ACR_CLIENT_ID" --password "$ACR_CLIENT_SECRET" --tenant e0e40cd0-d97b-4524-823d-d71f5ee37563 --output none
                      az account set --subscription d1aa0d0f-ac2a-46f7-ac25-aab69f19a0ca
                      image_json=$(az acr repository show --name acrharnesslabalvarez26 --image "harness-lab-api:$sha" --output json)
                      digest=$(printf '%s' "$image_json" | python3 -c 'import json,re,sys; d=json.load(sys.stdin); f=d["changeableAttributes"]; x=d["digest"]; assert re.fullmatch(r"sha256:[0-9a-f]{64}",x); assert f["writeEnabled"] is False and f["deleteEnabled"] is False; print(x)')
                      export DEPLOY_IMAGE="acrharnesslabalvarez26.azurecr.io/harness-lab-api@$digest"
                      export DEPLOY_SHA="$sha"
                      app_url="https://management.azure.com/subscriptions/d1aa0d0f-ac2a-46f7-ac25-aab69f19a0ca/resourceGroups/rg-harness-lab-20261104/providers/Microsoft.App/containerApps/api-harness-demo?api-version=2025-07-01"
                      work_dir=$(mktemp -d)
                      trap 'rm -rf "$work_dir"' EXIT
                      az rest --method get --url "$app_url" > "$work_dir/before.json"
                      python3 - "$work_dir" <<'PY'
                      import json, os, pathlib, sys
                      root = pathlib.Path(sys.argv[1])
                      app = json.loads((root / 'before.json').read_text())
                      template = app['properties']['template']
                      assert len(template['containers']) == 1
                      template['containers'][0]['image'] = os.environ['DEPLOY_IMAGE']
                      template['revisionSuffix'] = os.environ['DEPLOY_SHA'][:12]
                      (root / 'update.json').write_text(json.dumps({'properties': {'template': template}}))
                      PY
                      az rest --method patch --url "$app_url" --body "@$work_dir/update.json" --output none
                      ready=false
                      for attempt in $(seq 1 60); do
                        az rest --method get --url "$app_url" > "$work_dir/after.json"
                        if python3 - "$work_dir/after.json" <<'PY'
                      import json, os, sys
                      p = json.load(open(sys.argv[1]))['properties']
                      assert p['provisioningState'] == 'Succeeded'
                      assert p['template']['containers'][0]['image'] == os.environ['DEPLOY_IMAGE']
                      assert p['latestReadyRevisionName'] == p['latestRevisionName']
                      assert p['latestRevisionName'].endswith('--' + os.environ['DEPLOY_SHA'][:12])
                      PY
                        then ready=true; break; fi
                        sleep 10
                      done
                      test "$ready" = true
                      endpoint="https://api-harness-demo.calmocean-ef804483.southcentralus.azurecontainerapps.io/api/dummies"
                      curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --max-time 60 "$endpoint" > "$work_dir/response.json"
                      python3 - "$work_dir/response.json" <<'PY'
                      import json, sys
                      rows = json.load(open(sys.argv[1]))
                      assert isinstance(rows, list) and rows
                      assert all('PocoID' in row and 'POCODescription' in row for row in rows)
                      PY
                      curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --max-time 60 "https://api-harness-demo.calmocean-ef804483.southcentralus.azurecontainerapps.io/api/version" > "$work_dir/version.json"
                      python3 - "$work_dir/version.json" <<'PY'
                      import json, os, sys
                      version = json.load(open(sys.argv[1]))
                      assert version['Commit'] == os.environ['DEPLOY_SHA'], version
                      assert version['BuildNumber'] and version['ExecutionId'] and version['PipelineUrl'].startswith('https://app.harness.io/'), version
                      print(json.dumps(version, indent=2))
                      PY
                      echo "Website verified: $endpoint"
                      echo "Deployed commit $sha with image $DEPLOY_IMAGE"
